# tun-manager configuration
#
# Copy to ~/.config/tun-manager/config.yaml, then replace the tunnel names below
# with your own.
#
# This is the half of the configuration you own: how the program behaves. How
# often it refreshes, whether it notifies, which tunnel belongs to which group
# on which network. Nothing here decides what runs as root.
#
# The other half is /private/wireguard/config/tun-manager.yaml, owned by root
# and readable by nobody else: which binary is executed, which socket is bound,
# whether the hooks in a .conf may run. Those are not settings a program
# running as you should be able to change, because the next `sudo tun-manager`
# would honour them. See configs/tun-manager.example.yaml.
#
# The .conf files themselves live in /private/wireguard/config, one per tunnel,
# each file name being the tunnel name. That is not a setting either, in either
# file: a directory that can be named is a directory that can be filled with
# .conf files of somebody's own, and wg-quick runs those as root.
#
# Every field is optional, but the built-in defaults define no group and no
# network context: without this file every tunnel is listed and none belongs to
# a group, so the group commands and keys have nothing to act on.
#
# A key tun-manager does not recognise is refused rather than ignored, naming
# the file and the line. A misspelling that did nothing in silence would be
# indistinguishable from a setting that does not work. A key that used to be
# here and has moved is refused by name, saying where it went.
#
# The tunnel names here are placeholders and the addresses come from the ranges
# reserved for documentation (RFC 5737).

# How often the TUI refreshes on its own.
refresh_interval: 5m

# macOS notifications when a tunnel goes up or down, posted through osascript as
# the pre-sudo user because root has no GUI session to talk to.
#
# Off here, because the menu bar application raises its own — from a signed
# bundle, so they carry the application's icon rather than the terminal's, and
# without demoting anything. Leave this on if you do not run it, or you will get
# none from anywhere.
notify: false

# Recognisable networks. The first rule whose CIDR matches an address on one of
# its interfaces wins; when none matches, the context is "default".
contexts:
  - name: office
    interfaces: [en0, en10]
    cidr: 198.51.100.0/24

# Static group membership.
#   needed — started by `up --group needed` and by the TUI's `s` and `n` keys
#   extra  — offered for selection, started by the `e` key
#   all    — everything `down --all` and the TUI's `s` key tear down
groups:
  needed: [alpha, bravo]
  extra: [charlie, echo]
  all: [delta, alpha, bravo, charlie, echo]

# Tunnels whose group depends on the network.
#
# delta reaches the office LAN: sitting on that LAN it is redundant, so it is
# merely offered; anywhere else it is needed.
overrides:
  - tunnel: delta
    group_when:
      office: extra
      default: needed
