version: 2

project_name: tun-manager

before:
  hooks:
    - go mod tidy
    # The archives ship this file; regenerate it rather than trust the checkout.
    - go run ./internal/tools/notices -o THIRD-PARTY-NOTICES.txt ./...

builds:
  - id: tun-manager
    main: .
    binary: tun-manager
    env:
      # On darwin the Go runtime always goes through libSystem, so os/user
      # resolves SUDO_USER without cgo. That keeps the build reproducible and
      # cross-compilable.
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [amd64, arm64]
    # Keeps the build machine's paths out of the binary, so the same source at
    # the same version produces the same bytes anywhere.
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# A single file that runs on both Intel and Apple Silicon, next to the
# per-architecture archives.
universal_binaries:
  - id: tun-manager
    replace: false
    name_template: tun-manager

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "all" }}universal{{ else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      # BSD-3-Clause clause 2 requires the notice to travel with the binary,
      # and so do the licenses of the modules linked into it.
      - LICENSE
      - THIRD-PARTY-NOTICES.txt
      - configs/config.example.yaml

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Other
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```sh
    tar xzf tun-manager_{{ .Version }}_darwin_universal.tar.gz
    sudo install -m 0755 tun-manager /usr/local/bin/tun-manager
    tun-manager doctor
    ```

    The binaries are not notarized, so macOS quarantines them on first run.
    Clear it with `xattr -d com.apple.quarantine ./tun-manager`, or build from
    source with `make build`.

    tun-manager runs as root: the WireGuard control sockets are root-only.

    ## The menu bar application

    `tun-manager-menubar_{{ .Version }}_darwin_universal.zip` is optional: a
    menu bar item showing what `tun-manager` knows about your tunnels. Unlike
    the binaries above it is signed and notarized, so it opens on a double
    click with nothing to clear first.

    ```sh
    unzip tun-manager-menubar_{{ .Version }}_darwin_universal.zip
    mv "Tun Manager.app" /Applications/
    ```

    It is built and attached separately, and appears here shortly after the
    release itself: notarization is Apple's time, not this workflow's. It needs
    macOS 26.
