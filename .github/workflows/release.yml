name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A tag that fails its tests must not become a release.
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...
      - run: go test -race ./...

  release:
    needs: verify
    runs-on: macos-latest
    permissions:
      # Needed to create the release and upload its artifacts.
      contents: write
      # Needed for the build provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser builds the changelog from the commits since the previous
          # tag, so it needs the whole history.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Lets anyone verify a downloaded binary was built by this workflow from
      # this commit, with `gh attestation verify`.
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*.tar.gz
